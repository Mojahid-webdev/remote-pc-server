name: Build JC Helper APK
on:
  push:
    paths:
      - 'helper-android/**'
      - '.github/workflows/helper-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: helper-android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon assembleDebug
      - name: Rename
        run: cp helper-android/app/build/outputs/apk/debug/app-debug.apk jc-helper.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helper-latest
          name: JC Helper (latest)
          body: Install on the spare Android phone that stays on the PC's Wi-Fi.
          files: jc-helper.apk
          make_latest: true
